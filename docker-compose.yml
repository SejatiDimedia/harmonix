services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: harmonix_postgres
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-harmonix_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-harmonix_pass}
      POSTGRES_DB: ${DB_NAME:-harmonix_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-harmonix_user} -d ${DB_NAME:-harmonix_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
    driver: local
